name: Update JAMA Free Access RSS

on:
  push:
    branches:
      - main

  schedule:
    - cron: "15 7 * * *"

  workflow_dispatch:


permissions:
  contents: write


jobs:
  update:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Update RSS feed
        env:
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
        run: |
          python src/update_feed.py


      - name: Commit updated feed
        run: |

          git config user.name "JAMA Free RSS Bot"

          git config user.email "actions@users.noreply.github.com"

          git add public/jama-free.xml
          git add data/seen.json

          if git diff --cached --quiet; then

            echo "Nenhuma alteração."

          else

            git commit -m "Update JAMA free-access feed"

            git push

          fi
